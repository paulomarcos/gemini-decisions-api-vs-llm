  human_approval: yes         # refund
  shows_error: yes            # "Payment failed. Please try again."
  screen: checkout
  next_action: check_refund
  orders_affected: 1

V3_tracking_delays:
  team: shipping
  urgency: {answer: 2, also_ok: [3]}
  personal_data: no
  human_approval: no
  shows_error: {answer: yes, also_ok: [no]}     # red "delayed" warning, not a software error
  screen: tracking
  next_action: contact_carrier
  orders_affected: 3          # 37 shipments

