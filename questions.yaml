# Questions for the Kumo Supply inbox test.
# Every item gets the 4 shared questions + the 4 questions for its type = 8 questions.
# Per item: 3 yes/no (noul), 3 choice, 2 score. Same wording for the LLM and the Decisions API.

shared:
  team:
    type: choice
    instructions: "Which Kumo Supply team should handle this item?"
    options:
      billing: "Payments, invoices, charges, refunds and expense receipts"
      shipping: "Deliveries, carriers, shipping labels, damaged parcels and incoming stock"
      tech: "Errors and bugs in software, websites or carrier portals"
      sales: "Quotes, new customers and product questions before buying"
      management: "Contracts, legal terms and supplier agreements"
      other: "Anything that doesn't fit the teams above, including spam and newsletters"
  urgency:
    type: score
    instructions: "How urgent is this item for Kumo Supply?"
    levels:
      0: "No action needed, or just for information"
      1: "Handle this week"
      2: "Handle today: a customer or an order is blocked, or money is at risk"
      3: "Handle now: many orders are blocked or money is being lost right now"
  personal_data:
    type: noul
    instructions: "Does this item show personal data of a private person (a person's name together with a phone number, email, home address or card details)?"
  human_approval:
    type: noul
    instructions: "Does the next step for this item involve moving money (paying, refunding, reimbursing), deleting data, or making a commitment to a customer or supplier (a quote, a contract decision)? If yes, a human must approve it."

text:
  refund_request:
    type: noul
    instructions: "Does the sender ask for a refund or for money back?"
  language:
    type: choice
    instructions: "Which language is the message written in?"
    options:
      english: "English only"
      japanese: "Japanese only"
      mixed: "A mix of English and Japanese"
      other: "Another language"
  sender_type:
    type: choice
    instructions: "Who is the sender, from Kumo Supply's point of view?"
    options:
      existing_customer: "Someone who has already ordered from Kumo Supply"
      new_prospect: "A business or person who hasn't bought yet and is interested in buying"
      supplier: "A company that sells goods or services to Kumo Supply"
      not_a_customer: "Anyone else: newsletters, neighbors, spam"
  request_count:
    type: score
    instructions: "How many separate things does the sender ask Kumo Supply to do?"
    levels:
      0: "None"
      1: "One"
      2: "Two"
      3: "Three or more"

image:
  japanese_text:
    type: noul
    instructions: "Does the image contain Japanese text?"
  image_kind:
    type: choice
    instructions: "What does the image show?"
    options:
      receipt: "A store or purchase receipt"
      error_screenshot: "A screenshot of an error in software or a website"
      parcel_photo: "A photo of a parcel or box"
      shipping_label: "A shipping label"
      other: "Something else"
  next_action:
    type: choice
    instructions: "What should Kumo Supply do next with this image?"
    options:
      file_expense: "Record it as a company expense"
      fix_software: "Fix a software or integration problem"
      open_damage_claim: "Open a damage claim with the carrier"
      reprint_label: "Reprint the shipping label because it is unreadable or wrong"
      no_action: "Nothing needs to be done"
  severity:
    type: score
    instructions: "How serious is the problem shown in the image?"
    levels:
      0: "No problem"
      1: "Minor or cosmetic"
      2: "Blocks or damages one order"
      3: "Blocks many orders (more than 20) or loses money"

video:
  shows_error:
    type: noul
    instructions: "Does an error message appear at any point in the screen recording, even briefly?"
  screen:
    type: choice
    instructions: "Which screen is the recording mainly about?"
    options:
      label_creation: "Creating a shipping label"
      checkout: "A customer checkout or payment"
      tracking: "Tracking shipments"
      product_page: "A product page or catalog"
      other: "Something else"
  next_action:
    type: choice
    instructions: "What should Kumo Supply do next?"
    options:
      create_bug_ticket: "Create a bug ticket for the software team"
      check_refund: "Check the payments and refund the customer if needed"
      contact_carrier: "Contact the carrier about delayed shipments"
      no_action: "Nothing, it is for information only"
      other: "Something else"
  orders_affected:
    type: score
    instructions: "How many orders are affected by the problem shown?"
    levels:
      0: "None"
      1: "One"
      2: "Between 2 and 20"
      3: "More than 20"

pdf:
  money_decision:
    type: noul
    instructions: "Does this document require Kumo Supply to decide whether to pay, refund or commit money?"
  doc_type:
    type: choice
    instructions: "What kind of document is this?"
    options:
      invoice: "An invoice asking Kumo Supply to pay"
      contract: "A contract or agreement"
      delivery_note: "A delivery note for goods Kumo Supply received"
      claim_form: "A customer claim or complaint form"
      other: "Something else"
  language:
    type: choice
    instructions: "Which language is the document mainly written in?"
    options:
      english: "English"
      japanese: "Japanese"
      mixed: "A mix of English and Japanese"
      other: "Another language"
  discrepancies:
    type: score
    instructions: "How many discrepancies does the document contain (numbers that don't match each other, missing items, rates different from the agreed rate)?"
    levels:
      0: "None"
      1: "One"
      2: "Two"
      3: "Three or more"
